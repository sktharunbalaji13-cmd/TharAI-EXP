[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babylab"
version = "0.1.0"
description = "Baby AI Research Project - experimental laboratory instrumentation and observation (Milestones 001-003)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Baby AI Research Project" }]
keywords = ["research", "provenance", "observability", "event-sourcing", "birth"]

# ---------------------------------------------------------------------------
# RUNTIME DEPENDENCIES: NONE.
#
# Milestones 001 through 003 are implemented entirely against the Python
# standard library. The Cognitive State Observatory adds no web framework and no
# visualisation library: the snapshot contract is defined so a future client can
# be built, but no client is built here. See docs/development-log.md
# ("Dependency Policy"), ADR-002, and ADR-007.
#
# Standard-library modules relied upon:
#   hashlib, hmac, secrets, json, socket, threading, subprocess, unittest,
#   argparse, ast, dataclasses, datetime, pathlib, os, sys, re, io, contextlib,
#   tempfile, shutil, time, platform, uuid, enum, typing
# ---------------------------------------------------------------------------
dependencies = []

[project.optional-dependencies]
# Development-only. Pinned. NOT required to run the system or the test suite.
dev = [
    "pytest==8.3.4",
]

[project.scripts]
babylab-observer = "observer.cli:main"
babylab-observatory = "observatory.cli:main"
babylab-control = "control.cli:main"
babylab-integrity = "provenance.cli:main"
babylab-birth = "birth.cli:main"

[tool.setuptools]
packages = [
    "babylab",
    "events",
    "observer",
    "observatory",
    "control",
    "provenance",
    "birth",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Milestone 005. The host-security suite depends on Windows, a dedicated
# low-privilege account, real NTFS and a real cross-process launch, so it is
# excluded from the default run to keep the ordinary suite portable and
# deterministic. Run it explicitly with:
#     py -3 -m pytest tests/host_security -q
# See docs/m005-os-isolation.md, "Host-security test methodology".
norecursedirs = ["tests/host_security", ".*", "build", "dist", "__pycache__"]
markers = [
    "host_security: requires a real Windows host with a dedicated low-privilege principal",
]
